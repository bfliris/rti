<!DOCTYPE html>
<html>
<head>
    <base target="_top">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <style>
        .kanban-column { min-height: 60vh; transition: background-color 0.2s ease; }
        .sortable-ghost { opacity: 0.4; background-color: #cbd5e1 !important; }
        .loading-overlay { display: none; position: fixed; inset: 0; background: rgba(255,255,255,0.7); z-index: 1000; justify-content: center; align-items: center; }
        .sidebar { transition: transform 0.3s ease-in-out; }
        .sidebar-closed { transform: translateX(-100%); }
        .sidebar-min #sidebar { transform: translateX(-100%); }
        .sidebar-min #main-wrap { margin-left: 0 !important; }
        #sidebar-expand { display: none; }
        @media (min-width: 1024px) { .sidebar-min #sidebar-expand { display: flex; } }
        #toast { transition: opacity 0.3s ease, transform 0.3s ease; }
        #print-root { display: none; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        @media print {
            @page { size: landscape; margin: 10mm; }
            body { background: white !important; display: block !important; overflow: visible !important; }
            body > :not(#print-root) { display: none !important; }
            #print-root { display: block !important; color: #1e293b; font-family: Arial, sans-serif; }
            .print-header { border-bottom: 1px solid #cbd5e1; margin-bottom: 12px; padding-bottom: 8px; }
            .print-title { font-size: 18px; font-weight: 700; margin: 0; }
            .print-subtitle { color: #64748b; font-size: 11px; margin: 3px 0 0; }
            .print-board { align-items: start; display: grid; gap: 8px; grid-template-columns: repeat(auto-fit, minmax(125px, 1fr)); }
            .print-column { border: 1px solid #cbd5e1; border-radius: 8px; }
            .print-column-header { border-bottom: 1px solid #cbd5e1; padding: 5px 6px; }
            .print-column-title-row { align-items: center; display: flex; justify-content: space-between; }
            .print-column-title { font-size: 10px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; }
            .print-count { background: white; border: 1px solid #cbd5e1; border-radius: 999px; font-size: 9px; font-weight: 800; padding: 1px 6px; }
            .print-header-details { color: #475569; display: grid; gap: 2px; font-size: 8px; margin-top: 5px; }
            .print-detail { display: grid; gap: 3px; grid-template-columns: 48px 1fr; line-height: 1.2; }
            .print-detail-label { font-weight: 800; }
            .print-detail-value { overflow-wrap: anywhere; }
            .print-student-list { background: white; list-style: none; margin: 0; padding: 4px 6px 6px; }
            .print-student { border-bottom: 1px solid #e2e8f0; color: #1e293b; font-size: 9px; line-height: 1.15; padding: 2px 0; }
            .print-student-team { color: #94a3b8; font-weight: 400; margin-left: 3px; }
            .print-student:last-child { border-bottom: 0; }
            .print-empty { color: #94a3b8; font-size: 9px; font-style: italic; padding: 8px 6px; text-align: center; }
            * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex overflow-hidden w-full">

    <div id="loading" class="loading-overlay">
        <div class="flex flex-col items-center">
            <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600 mb-4"></div>
            <p class="text-slate-600 font-medium text-center" id="loading-text">Connecting to Google Sheets...</p>
        </div>
    </div>

    <div id="toast" class="fixed bottom-6 right-6 z-[200] px-4 py-2.5 rounded-xl shadow-lg text-sm font-semibold text-white opacity-0 translate-y-2 pointer-events-none">Saved</div>

    <div id="login-overlay" class="hidden fixed inset-0 z-[300] bg-slate-900 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-sm overflow-hidden">
            <div class="bg-blue-600 px-6 py-5 text-white">
                <h2 class="text-xl font-bold">RTI / MTSS</h2>
                <p class="text-blue-200 text-sm mt-1">Sign in to view grade levels</p>
            </div>
            <form id="login-form" onsubmit="submitLogin(event)" class="p-6 space-y-4">
                <div>
                    <label class="block text-[11px] text-slate-500 uppercase font-bold tracking-wider mb-1.5">Username</label>
                    <input id="login-username" type="text" autocomplete="username" autofocus
                        class="w-full text-sm border border-slate-200 rounded-lg px-3 py-2.5 focus:ring-2 focus:ring-blue-500 focus:border-blue-400 outline-none" />
                </div>
                <div>
                    <label class="block text-[11px] text-slate-500 uppercase font-bold tracking-wider mb-1.5">Password</label>
                    <input id="login-password" type="password" autocomplete="current-password"
                        class="w-full text-sm border border-slate-200 rounded-lg px-3 py-2.5 focus:ring-2 focus:ring-blue-500 focus:border-blue-400 outline-none" />
                </div>
                <p id="login-error" class="hidden text-sm text-red-600 font-medium"></p>
                <button id="login-submit" type="submit"
                    class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-lg transition shadow-sm disabled:opacity-60">
                    Sign In
                </button>
            </form>
        </div>
    </div>

    <button id="sidebar-expand" onclick="toggleSidebarMinimize()" class="fixed top-4 left-4 z-50 bg-slate-900 hover:bg-slate-800 text-white p-2 rounded-lg shadow-lg items-center justify-center" title="Expand sidebar">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7" /></svg>
    </button>

    <aside id="sidebar" class="sidebar fixed inset-y-0 left-0 w-64 bg-slate-900 text-white z-50 shadow-2xl flex flex-col lg:translate-x-0">
        <div class="p-6 border-b border-slate-800 flex justify-between items-center">
            <div>
                <h2 class="text-xl font-bold text-white">RTI / MTSS</h2>
                <p class="text-xs text-slate-400 mt-1">Grade Level Tray</p>
            </div>
            <div class="flex items-center gap-1">
                <button onclick="toggleSidebarMinimize()" class="hidden lg:block text-slate-400 hover:text-white p-1" title="Minimize sidebar">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 19l-7-7 7-7m8 14l-7-7 7-7" /></svg>
                </button>
                <button onclick="toggleSidebar()" class="lg:hidden text-slate-400 hover:text-white text-xl">&times;</button>
            </div>
        </div>
        <nav id="grade-nav" class="flex-grow p-4 space-y-2 overflow-y-auto">
            <div class="text-slate-500 text-sm animate-pulse">Scanning for grades...</div>
        </nav>
        <div class="p-4 border-t border-slate-800 space-y-3">
            <div class="flex items-center justify-between">
                <span id="session-user" class="text-xs text-slate-400 truncate"></span>
                <button onclick="logout()" class="text-xs text-slate-400 hover:text-white font-semibold flex items-center gap-1" title="Sign out">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" /></svg>
                    Sign out
                </button>
            </div>
            <div class="text-[10px] text-slate-500 uppercase tracking-widest font-semibold text-center">
                RTI System v3.0
            </div>
        </div>
    </aside>

    <div id="main-wrap" class="flex-grow lg:ml-64 flex flex-col h-screen w-full overflow-hidden">
        <header class="bg-white border-b p-4 flex justify-between items-center shadow-sm z-40 shrink-0">
            <div class="flex items-center space-x-4">
                <button onclick="toggleSidebar()" class="lg:hidden bg-slate-100 hover:bg-slate-200 p-2 rounded-md transition">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-slate-600" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7" /></svg>
                </button>
                <div>
                    <h1 class="text-lg font-bold text-slate-800 leading-tight" id="current-view-title">System Status</h1>
                    <p class="text-xs text-slate-500" id="student-count">Initializing...</p>
                </div>
                <div id="subject-toggle" class="hidden sm:flex bg-slate-100 rounded-lg p-1 ml-2">
                    <button data-subject="ELA"  onclick="setSubject('ELA')"  class="px-3 py-1.5 rounded-md text-sm font-semibold transition">ELA</button>
                    <button data-subject="Math" onclick="setSubject('Math')" class="px-3 py-1.5 rounded-md text-sm font-semibold transition">Math</button>
                </div>
                <div id="zoom-toggle" class="hidden sm:flex items-center bg-slate-100 rounded-lg p-1 ml-2" title="Zoom board to fit more or fewer columns">
                    <button onclick="zoomBoard(-1)" class="w-7 h-7 flex items-center justify-center rounded-md text-slate-600 hover:bg-white hover:shadow-sm font-bold text-lg leading-none transition" title="Zoom out (more columns)">−</button>
                    <button onclick="zoomBoard(0)" id="zoom-level" class="px-2 min-w-[3rem] text-center text-xs font-semibold text-slate-600 hover:text-slate-900 transition" title="Reset zoom">100%</button>
                    <button onclick="zoomBoard(1)" class="w-7 h-7 flex items-center justify-center rounded-md text-slate-600 hover:bg-white hover:shadow-sm font-bold text-lg leading-none transition" title="Zoom in (fewer columns)">+</button>
                </div>
            </div>
            <div class="flex items-center space-x-3">
                <div class="relative" id="search-wrap">
                    <div class="relative">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-slate-400 absolute left-3 top-1/2 -translate-y-1/2 pointer-events-none" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-4.35-4.35M11 19a8 8 0 100-16 8 8 0 000 16z" /></svg>
                        <input id="student-search" type="text" autocomplete="off"
                            oninput="onSearchInput()" onfocus="onSearchInput()" onkeydown="onSearchKey(event)"
                            placeholder="Search students…"
                            class="w-56 text-sm border border-slate-200 rounded-lg pl-9 pr-3 py-2 bg-white focus:ring-2 focus:ring-blue-500 focus:border-blue-400 outline-none transition" />
                    </div>
                    <div id="search-results" class="hidden absolute right-0 mt-1 w-72 max-h-80 overflow-y-auto bg-white border border-slate-200 rounded-lg shadow-xl z-50"></div>
                </div>
                <button onclick="printCurrentGrade()" class="bg-slate-800 hover:bg-slate-900 text-white px-4 py-2 rounded-lg text-sm font-semibold transition flex items-center shadow-sm" title="Print Current Board">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-1.5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z" /></svg>
                    Print
                </button>
                <button onclick="exportCurrentGrade()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-lg text-sm font-semibold transition flex items-center shadow-sm" title="Export Current Board as Spreadsheet">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-1.5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v2a2 2 0 002 2h12a2 2 0 002-2v-2M7 10l5 5 5-5M12 15V3" /></svg>
                    Export
                </button>
                <button onclick="addGroupPrompt()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm font-semibold transition flex items-center shadow-sm">
                    <span class="mr-1">+</span> New Column
                </button>
                <button onclick="refreshData()" class="bg-white border border-slate-200 hover:bg-slate-50 text-slate-600 p-2 rounded-lg transition shadow-sm" title="Refresh Data">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" /></svg>
                </button>
            </div>
        </header>

        <main class="flex-1 overflow-x-auto overflow-y-auto p-6 bg-slate-50 relative w-full">
            <div class="w-full flex justify-center mb-6">
                <input id="board-bar" type="text" oninput="saveBoardBar()"
                    placeholder="Add a title or note for this board…"
                    class="w-full max-w-2xl text-center text-lg font-semibold text-slate-700 bg-white border border-slate-200 rounded-xl px-4 py-2.5 shadow-sm placeholder:font-normal placeholder:text-slate-400 focus:ring-2 focus:ring-blue-500 focus:border-blue-400 outline-none transition" />
            </div>
            <div id="board" class="flex flex-row flex-nowrap space-x-6 items-start h-full pb-8 w-max min-w-full"></div>
        </main>
    </div>

    <div id="print-root"></div>

    <div id="column-pane" class="hidden fixed inset-0 z-[90] bg-slate-900/50 backdrop-blur-sm p-4 sm:p-6 lg:p-10 opacity-0 transition-opacity duration-200">
        <div id="column-pane-content" class="bg-slate-50 rounded-2xl shadow-2xl w-full h-full max-w-6xl mx-auto flex flex-col overflow-hidden transform scale-95 transition-transform duration-200">
            <div class="shrink-0 px-6 py-4 border-b border-slate-200 bg-white flex items-center justify-between">
                <div class="min-w-0">
                    <h3 id="column-pane-title" class="text-lg font-bold text-slate-800 truncate">Column</h3>
                    <p id="column-pane-sub" class="text-xs text-slate-500 mt-0.5">&nbsp;</p>
                </div>
                <button onclick="closeColumnPane()" class="ml-4 shrink-0 bg-slate-100 hover:bg-slate-200 p-2 rounded-lg transition text-slate-600" title="Close">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" /></svg>
                </button>
            </div>
            <div id="column-pane-body" class="flex-1 overflow-y-auto p-6"></div>
        </div>
    </div>

    <div id="student-modal" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[100] flex justify-center items-center p-4 opacity-0 transition-opacity duration-300">
        <div class="bg-white rounded-2xl shadow-2xl max-w-lg w-full overflow-hidden flex flex-col transform transition-transform scale-95 duration-300" id="student-modal-content">
            <div class="bg-blue-600 p-4 flex justify-between items-center text-white">
                <div class="flex flex-col">
                    <h3 class="font-bold text-lg leading-tight" id="modal-name">Student Name</h3>
                    <span class="text-blue-200 text-xs font-mono mt-1" id="modal-id">ID: 000</span>
                </div>
                <button onclick="closeModal()" class="hover:bg-blue-700 p-2 rounded-lg transition bg-blue-700/50">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" /></svg>
                </button>
            </div>
            <div class="p-6 overflow-y-auto max-h-[80vh] space-y-5">
                <div class="grid grid-cols-2 gap-4" id="modal-details"></div>

                <div class="bg-slate-50 p-3 rounded-lg border border-slate-100">
                    <label class="block text-[10px] text-slate-400 uppercase font-bold tracking-wider mb-1.5" id="modal-reassign-label">Reassign Group</label>
                    <select id="modal-group-select" onchange="reassignFromModal(this.value)" class="w-full text-sm border border-slate-200 rounded-lg px-3 py-2 bg-white focus:ring-2 focus:ring-blue-500 outline-none"></select>
                </div>

                <div>
                    <button type="button" onclick="toggleHistory()" class="w-full flex items-center justify-between mb-2">
                        <h4 class="text-[11px] text-slate-500 uppercase font-bold tracking-widest" id="history-title">Placement History</h4>
                        <svg id="history-chevron" xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-slate-400 transition-transform duration-200" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" /></svg>
                    </button>
                    <div id="history-list" class="space-y-2 max-h-48 overflow-y-auto hidden"></div>
                </div>

                <div>
                    <div class="flex items-center justify-between mb-2">
                        <h4 class="text-[11px] text-slate-500 uppercase font-bold tracking-widest">Intervention Notes</h4>
                    </div>
                    <div id="notes-list" class="space-y-2 max-h-48 overflow-y-auto mb-3"></div>
                    <textarea id="note-input" rows="2" placeholder="Add a note for this student…" class="w-full text-sm border border-slate-200 rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 outline-none resize-none"></textarea>
                    <button onclick="submitNote()" class="mt-2 w-full bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold py-2 rounded-lg transition">Add Note</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let students = [];
        let groups = {};
        let colors = {};
        let columnMeta = {};
        let currentGrade = localStorage.getItem('rtiGrade') || null;
        let currentSubject = localStorage.getItem('rtiSubject') || 'ELA';
        const ZOOM_MIN = 0.5, ZOOM_MAX = 1.4, ZOOM_STEP = 0.1;
        let boardZoom = Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, parseFloat(localStorage.getItem('rtiZoom')) || 1));
        let activeStudentId = null;
        let columnSortable = null;
        let cardSortables = [];
        let historyOpen = false;
        let historyLoadedId = null;
        let session = null; // { username, password, isMaster, grades }

        const COLUMN_THEMES = {
            slate:  { bg: 'bg-slate-200/40',  border: 'border-slate-200/60',  headerBg: 'bg-white/50',     text: 'text-slate-500' },
            red:    { bg: 'bg-red-100/50',     border: 'border-red-200/60',    headerBg: 'bg-red-50/80',    text: 'text-red-700'   },
            yellow: { bg: 'bg-yellow-100/50',  border: 'border-yellow-200/60', headerBg: 'bg-yellow-50/80', text: 'text-yellow-700'},
            green:  { bg: 'bg-green-100/50',   border: 'border-green-200/60',  headerBg: 'bg-green-50/80',  text: 'text-green-700' },
            blue:   { bg: 'bg-blue-100/50',    border: 'border-blue-200/60',   headerBg: 'bg-blue-50/80',   text: 'text-blue-700'  }
        };
        const FLAG_STYLES = { SPED: 'bg-red-100 text-red-700', EL: 'bg-amber-100 text-amber-700', '504': 'bg-purple-100 text-purple-700' };
        const COLOR_KEYS = ['slate', 'red', 'yellow', 'green', 'blue'];
        const SWATCH = { slate: 'bg-slate-300 border-slate-400', red: 'bg-red-400 border-red-500', yellow: 'bg-yellow-400 border-yellow-500', green: 'bg-green-400 border-green-500', blue: 'bg-blue-400 border-blue-500' };
        const PRINT_THEMES = {
            slate:  { bg: '#f8fafc', border: '#cbd5e1', header: '#f1f5f9', text: '#475569' },
            red:    { bg: '#fef2f2', border: '#fecaca', header: '#fee2e2', text: '#b91c1c' },
            yellow: { bg: '#fefce8', border: '#fde68a', header: '#fef3c7', text: '#a16207' },
            green:  { bg: '#f0fdf4', border: '#bbf7d0', header: '#dcfce7', text: '#15803d' },
            blue:   { bg: '#eff6ff', border: '#bfdbfe', header: '#dbeafe', text: '#1d4ed8' }
        };
        const LEVEL_BADGE_STYLES = {
            slate: 'bg-slate-100 border-slate-200 text-slate-500',
            red: 'bg-red-100 border-red-200 text-red-700',
            yellow: 'bg-yellow-100 border-yellow-200 text-yellow-700',
            green: 'bg-green-100 border-green-200 text-green-700',
            blue: 'bg-blue-100 border-blue-200 text-blue-700'
        };

        window.onload = () => { applySidebarMinimized(); restoreSession(); };

        /* ───────────────────────────── Auth ───────────────────────────── */

        // Temporary switch: when true, the login screen is skipped and the app
        // loads with full (master) access. Set to false to re-enable logins.
        const LOGIN_DISABLED = false;

        function restoreSession() {
            if (LOGIN_DISABLED) {
                session = { username: '', password: '', isMaster: true, grades: [] };
                showLogin(false);
                refreshData();
                return;
            }
            let saved = null;
            try { saved = JSON.parse(sessionStorage.getItem('rtiSession') || 'null'); } catch (e) { saved = null; }
            if (saved && saved.username && saved.password) {
                session = saved;
                showLogin(false);
                refreshData();
            } else {
                showLogin(true);
            }
        }

        function showLogin(show) {
            document.getElementById('login-overlay').classList.toggle('hidden', !show);
            if (show) {
                document.getElementById('login-error').classList.add('hidden');
                const u = document.getElementById('login-username');
                if (u) setTimeout(() => u.focus(), 50);
            }
        }

        function submitLogin(event) {
            event.preventDefault();
            const username = document.getElementById('login-username').value.trim();
            const password = document.getElementById('login-password').value;
            const errEl = document.getElementById('login-error');
            const btn = document.getElementById('login-submit');
            errEl.classList.add('hidden');

            if (!username || !password) {
                errEl.textContent = 'Enter a username and password.';
                errEl.classList.remove('hidden');
                return;
            }
            if (!inAppsScript()) {
                errEl.textContent = 'Open this through your Google Apps Script web-app URL.';
                errEl.classList.remove('hidden');
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Signing in…';
            google.script.run
                .withSuccessHandler((res) => {
                    btn.disabled = false;
                    btn.textContent = 'Sign In';
                    if (!res || !res.success) {
                        errEl.textContent = (res && res.error) || 'Sign in failed.';
                        errEl.classList.remove('hidden');
                        return;
                    }
                    session = { username, password, isMaster: !!res.isMaster, grades: res.grades || [] };
                    try { sessionStorage.setItem('rtiSession', JSON.stringify(session)); } catch (e) {}
                    document.getElementById('login-password').value = '';
                    showLogin(false);
                    refreshData();
                })
                .withFailureHandler((err) => {
                    btn.disabled = false;
                    btn.textContent = 'Sign In';
                    errEl.textContent = 'Error: ' + err.message;
                    errEl.classList.remove('hidden');
                })
                .authenticate(username, password);
        }

        function logout() {
            session = null;
            try { sessionStorage.removeItem('rtiSession'); } catch (e) {}
            students = []; groups = {}; colors = {}; columnMeta = {};
            currentGrade = null;
            document.getElementById('board').innerHTML = '';
            document.getElementById('grade-nav').innerHTML = '';
            document.getElementById('session-user').textContent = '';
            document.getElementById('login-username').value = '';
            document.getElementById('login-password').value = '';
            showLogin(true);
        }
        window.addEventListener('beforeprint', () => { if (currentGrade) buildPrintView(); });
        window.addEventListener('afterprint', clearPrintView);

        function toggleSidebar() {
            const sb = document.getElementById('sidebar');
            sb.classList.toggle('sidebar-closed');
            sb.classList.toggle('lg:translate-x-0');
        }

        function applySidebarMinimized() {
            document.body.classList.toggle('sidebar-min', localStorage.getItem('rtiSidebarMin') === '1');
        }

        function toggleSidebarMinimize() {
            const min = localStorage.getItem('rtiSidebarMin') !== '1';
            localStorage.setItem('rtiSidebarMin', min ? '1' : '0');
            applySidebarMinimized();
        }

        function showLoading(show, text = 'Syncing with Sheet...') {
            document.getElementById('loading').style.display = show ? 'flex' : 'none';
            document.getElementById('loading-text').innerText = text;
        }

        let toastTimer = null;
        function toast(message, kind) {
            const t = document.getElementById('toast');
            const colorByKind = { pending: 'bg-slate-700', ok: 'bg-green-600', err: 'bg-red-600' };
            t.className = t.className.replace(/bg-\S+/g, '');
            t.classList.add(colorByKind[kind] || 'bg-slate-700');
            t.innerText = message;
            t.style.opacity = '1';
            t.style.transform = 'translateY(0)';
            clearTimeout(toastTimer);
            if (kind !== 'pending') {
                toastTimer = setTimeout(() => { t.style.opacity = '0'; t.style.transform = 'translateY(0.5rem)'; }, 1800);
            }
        }

        function inAppsScript() { return typeof google !== 'undefined' && google.script && google.script.run; }

        function refreshData() {
            if (!session) { showLogin(true); return; }
            showLoading(true);
            if (!inAppsScript()) {
                showLoading(false);
                alert('Open this through your Google Apps Script web-app URL.');
                return;
            }
            const label = document.getElementById('session-user');
            if (label) label.textContent = session.username + (session.isMaster ? ' · Master' : '');
            google.script.run
                .withSuccessHandler((data) => {
                    students = data.students || [];
                    groups = data.groups || {};
                    colors = data.colors || {};
                    columnMeta = data.columnMeta || {};

                    if (students.length === 0) {
                        document.getElementById('grade-nav').innerHTML = '<div class="text-slate-500 p-2 text-sm text-center">No students available for this account yet.</div>';
                        document.getElementById('board').innerHTML = '';
                        showLoading(false);
                        return;
                    }

                    const grades = availableGrades();
                    if (!currentGrade || !grades.includes(currentGrade)) currentGrade = grades[0];

                    renderSubjectToggle();
                    renderSidebar();
                    renderBoard();
                    showLoading(false);
                })
                .withFailureHandler((err) => {
                    showLoading(false);
                    // A rejected getData almost always means the session is no longer valid.
                    logout();
                    const errEl = document.getElementById('login-error');
                    errEl.textContent = 'Your session expired. Please sign in again.';
                    errEl.classList.remove('hidden');
                })
                .getData(session.username, session.password);
        }

        function availableGrades() { return [...new Set(students.map(s => s.grade))].sort(); }

        function renderSubjectToggle() {
            const wrap = document.getElementById('subject-toggle');
            wrap.classList.remove('hidden');
            const zoomWrap = document.getElementById('zoom-toggle');
            if (zoomWrap) zoomWrap.classList.remove('hidden');
            applyBoardZoom();
            wrap.querySelectorAll('button').forEach(btn => {
                const active = btn.dataset.subject === currentSubject;
                btn.className = 'px-3 py-1.5 rounded-md text-sm font-semibold transition ' +
                    (active ? 'bg-white text-blue-700 shadow' : 'text-slate-500 hover:text-slate-700');
            });
        }

        function setSubject(subject) {
            currentSubject = subject;
            localStorage.setItem('rtiSubject', subject);
            renderSubjectToggle();
            renderBoard();
        }

        function renderSidebar() {
            const nav = document.getElementById('grade-nav');
            nav.innerHTML = availableGrades().map(grade => `
                <button onclick="setGrade('${grade}')" class="w-full text-left px-4 py-3 rounded-xl transition flex justify-between items-center ${currentGrade === grade ? 'bg-blue-600 text-white shadow-lg ring-4 ring-blue-600/20' : 'hover:bg-slate-800 text-slate-400'}">
                    <span class="font-bold">${grade === 'Unassigned' ? 'No Grade' : 'Grade ' + grade}</span>
                    <span class="text-xs opacity-60">${students.filter(s => s.grade === grade).length}</span>
                </button>
            `).join('');
        }

        function setGrade(grade) {
            currentGrade = grade;
            localStorage.setItem('rtiGrade', grade);
            renderSidebar();
            renderBoard();
            if (window.innerWidth < 1024) toggleSidebar();
        }

        function ensureBoardState() {
            if (!currentGrade) return;
            if (!groups[currentSubject]) groups[currentSubject] = {};
            if (!groups[currentSubject][currentGrade]) groups[currentSubject][currentGrade] = [];
            if (!colors[currentSubject]) colors[currentSubject] = {};
            if (!colors[currentSubject][currentGrade]) colors[currentSubject][currentGrade] = {};
            if (!columnMeta[currentSubject]) columnMeta[currentSubject] = {};
            if (!columnMeta[currentSubject][currentGrade]) columnMeta[currentSubject][currentGrade] = {};
        }

        function boardColumns() {
            ensureBoardState();
            return (groups[currentSubject] && groups[currentSubject][currentGrade]) || [];
        }
        function columnColors() {
            ensureBoardState();
            return (colors[currentSubject] && colors[currentSubject][currentGrade]) || {};
        }
        function columnMetadata(groupName) {
            ensureBoardState();
            if (!columnMeta[currentSubject][currentGrade][groupName]) {
                columnMeta[currentSubject][currentGrade][groupName] = {};
            }
            return columnMeta[currentSubject][currentGrade][groupName];
        }
        function scaleOf(student) {
            const v = Number(student[currentSubject].scale);
            return isNaN(v) ? Infinity : v; // blanks sink to the bottom
        }

        function normalizedLevel(level) {
            return String(level || '').trim().toLowerCase();
        }

        function levelColor(subject, level) {
            const value = normalizedLevel(level);
            if (!value) return 'slate';

            // Most-severe deficits, regardless of how the district phrases them
            // ("two or more grade levels below", "well below", "far below…").
            if (value.includes('two or more') || value.includes('well below') || value.includes('far below')) return 'red';

            const hasBelow = value.includes('below');
            const hasAbove = value.includes('above');

            // "On/at grade", "on/at benchmark", "on track" and "on or above" all
            // read as on-track — matched before the plain below/above keywords so
            // that "on or above grade level" is not mistaken for an above band.
            const onTrack = value.includes('on or above') || value.includes('at or above') ||
                            value.includes('on grade') || value.includes('at grade') ||
                            value.includes('on benchmark') || value.includes('at benchmark') ||
                            value.includes('on track') || value === 'on' || value === 'at' ||
                            value.startsWith('on ') || value.startsWith('at ');

            if (onTrack) return 'green';

            // Any remaining "below" is a moderate deficit.
            if (hasBelow) return 'yellow';

            // Exceeds grade level: Math has a distinct blue band; ELA tops out at green.
            if (hasAbove) return subject === 'Math' ? 'blue' : 'green';

            // Bare benchmark labels ("Benchmark") read as on-track.
            if (value.includes('benchmark')) return 'green';

            return 'slate';
        }

        function levelBadge(student, subject, label) {
            const level = student[subject] && student[subject].level;
            const color = levelColor(subject, level);
            return `<span class="h-6 w-6 rounded-full border ${LEVEL_BADGE_STYLES[color]} flex items-center justify-center text-xs font-black shadow-sm" title="${subject} BOY: ${escapeAttr(level || 'No BOY level')}">${label}</span>`;
        }

        function currentLevelBadge(student, subject, label) {
            const level = student[subject] && student[subject].currentLevel;
            const color = levelColor(subject, level);
            return `<span class="h-6 w-6 rounded-full border ${LEVEL_BADGE_STYLES[color]} flex items-center justify-center text-xs font-black shadow-sm" title="${subject} Current: ${escapeAttr(level || 'No current level')}">${label}</span>`;
        }

        function printCurrentGrade() {
            if (!currentGrade) {
                alert('Select a grade before printing.');
                return;
            }
            buildPrintView();
            window.print();
        }

        function clearPrintView() {
            const root = document.getElementById('print-root');
            if (root) root.innerHTML = '';
        }

        function inlineStyle(obj) {
            return Object.keys(obj).map(key => `${key}:${obj[key]}`).join(';');
        }

        function columnHeaderDetails(group) {
            const meta = columnMetadata(group);
            const rows = [
                ['Location', meta.location],
                ['Skill', meta.skill],
                ['Curriculum', meta.curriculum]
            ];

            return rows.map(([label, value]) => `
                <div class="print-detail">
                    <span class="print-detail-label">${escapeHtml(label)}:</span>
                    <span class="print-detail-value">${value ? escapeHtml(value) : '&mdash;'}</span>
                </div>`).join('');
        }

        function renderPrintNames(list) {
            if (list.length === 0) return '<div class="print-empty">Empty</div>';
            return `<ol class="print-student-list">${list.map(student => `<li class="print-student">${escapeHtml(student.name)}${student.team ? `<span class="print-student-team">— ${escapeHtml(student.team)}</span>` : ''}</li>`).join('')}</ol>`;
        }

        function buildPrintView() {
            const root = document.getElementById('print-root');
            if (!root || !currentGrade) return;

            const cols = boardColumns();
            const colColors = columnColors();
            const gradeStudents = students.filter(s => s.grade === currentGrade);

            const columnsHtml = cols.map(group => {
                const theme = PRINT_THEMES[colColors[group] || 'slate'] || PRINT_THEMES.slate;
                const inColumn = gradeStudents
                    .filter(s => s[currentSubject].group === group)
                    .sort((a, b) => scaleOf(a) - scaleOf(b));
                const columnStyle = inlineStyle({ background: theme.bg, 'border-color': theme.border });
                const headerStyle = inlineStyle({ background: theme.header, 'border-color': theme.border, color: theme.text });
                const detailsHtml = columnHeaderDetails(group);

                return `
                    <section class="print-column" style="${columnStyle}">
                        <div class="print-column-header" style="${headerStyle}">
                            <div class="print-column-title-row">
                                <div class="print-column-title">${escapeHtml(group)}</div>
                                <div class="print-count">${inColumn.length}</div>
                            </div>
                            <div class="print-header-details">${detailsHtml}</div>
                        </div>
                        ${renderPrintNames(inColumn)}
                    </section>`;
            }).join('');

            root.innerHTML = `
                <section>
                    <div class="print-header">
                        <h1 class="print-title">Grade ${escapeHtml(currentGrade)} - ${escapeHtml(currentSubject)} Groups</h1>
                        <p class="print-subtitle">${gradeStudents.length} students across ${cols.length} columns</p>
                    </div>
                    <div class="print-board">
                        ${columnsHtml || '<div class="print-empty">No columns available for this grade.</div>'}
                    </div>
                </section>`;
        }

        // Export builds a real .xlsx entirely in the browser from data already loaded,
        // so it needs no server call, no Google authorization, and no Drive access —
        // every user can download it with one click. Formatting mirrors the print view.
        function exportCurrentGrade() {
            if (!currentGrade) {
                alert('Select a grade before exporting.');
                return;
            }

            const btn = document.querySelector('[onclick="exportCurrentGrade()"]');
            if (btn) { btn.disabled = true; btn.classList.add('opacity-60', 'cursor-wait'); }
            try {
                const cols = boardColumns();
                const colColors = columnColors();
                const gradeStudents = students.filter(s => s.grade === currentGrade);

                const columns = cols.map(group => ({
                    group,
                    theme: PRINT_THEMES[colColors[group] || 'slate'] || PRINT_THEMES.slate,
                    meta: columnMetadata(group),
                    students: gradeStudents
                        .filter(s => s[currentSubject].group === group)
                        .sort((a, b) => scaleOf(a) - scaleOf(b))
                }));

                const bytes = buildBoardXlsx(columns, gradeStudents.length);
                const filename = `Grade_${currentGrade}_${currentSubject}_Groups.xlsx`;
                downloadBytes(bytes, filename,
                    'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
            } catch (err) {
                alert('Export failed: ' + (err && err.message ? err.message : err));
            } finally {
                if (btn) { btn.disabled = false; btn.classList.remove('opacity-60', 'cursor-wait'); }
            }
        }

        function downloadBytes(bytes, filename, mimeType) {
            const url = URL.createObjectURL(new Blob([bytes], { type: mimeType }));
            const link = document.createElement('a');
            link.href = url;
            link.download = filename;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            setTimeout(() => URL.revokeObjectURL(url), 1000);
        }

        /* ─── Minimal, dependency-free .xlsx writer ─────────────────────────────
           Produces an OOXML workbook (a ZIP of XML parts) with cell fills, fonts,
           and borders. Strings are stored inline; the ZIP uses the STORED method
           (no compression) so no deflate library is needed. */

        function xmlEscape(s) {
            return String(s == null ? '' : s)
                .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;').replace(/'/g, '&apos;');
        }

        function colLetter(n) { // 1 -> A
            let s = '';
            while (n > 0) { const m = (n - 1) % 26; s = String.fromCharCode(65 + m) + s; n = (n - m - 1) / 26; }
            return s;
        }

        function argb(hex) { return 'FF' + String(hex).replace('#', '').toUpperCase(); }

        function newStyleSheet() {
            const fonts = ['<font><sz val="11"/><name val="Calibri"/></font>'];
            const fills = [
                '<fill><patternFill patternType="none"/></fill>',
                '<fill><patternFill patternType="gray125"/></fill>'
            ];
            const borders = ['<border><left/><right/><top/><bottom/><diagonal/></border>'];
            const xfs = ['<xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/>'];
            const cache = {};

            const dedupe = (arr, xml) => {
                const key = arr === fonts ? 'f' : arr === fills ? 'l' : 'b';
                const id = key + xml;
                if (cache[id] === undefined) { cache[id] = arr.length; arr.push(xml); }
                return cache[id];
            };

            function font(spec) {
                spec = spec || {};
                const xml = '<font>' + (spec.bold ? '<b/>' : '') +
                    '<sz val="' + (spec.size || 11) + '"/>' +
                    (spec.color ? '<color rgb="' + argb(spec.color) + '"/>' : '') +
                    '<name val="Calibri"/></font>';
                return dedupe(fonts, xml);
            }
            function fill(color) {
                if (!color) return 0;
                const xml = '<fill><patternFill patternType="solid"><fgColor rgb="' +
                    argb(color) + '"/><bgColor indexed="64"/></patternFill></fill>';
                return dedupe(fills, xml);
            }
            function border(color) {
                if (!color) return 0;
                const c = '<color rgb="' + argb(color) + '"/>';
                const side = tag => '<' + tag + ' style="thin">' + c + '</' + tag + '>';
                const xml = '<border>' + side('left') + side('right') + side('top') + side('bottom') +
                    '<diagonal/></border>';
                return dedupe(borders, xml);
            }
            function style(spec) {
                spec = spec || {};
                const fontId = font(spec.font);
                const fillId = fill(spec.fill);
                const borderId = border(spec.border);
                const align = spec.align
                    ? '<alignment horizontal="' + spec.align + '"' + (spec.wrap ? ' wrapText="1"' : '') + '/>'
                    : (spec.wrap ? '<alignment wrapText="1"/>' : '');
                const xf = '<xf numFmtId="0" fontId="' + fontId + '" fillId="' + fillId +
                    '" borderId="' + borderId + '" xfId="0" applyFont="1" applyFill="1" applyBorder="1"' +
                    (align ? ' applyAlignment="1">' + align + '</xf>' : '/>');
                xfs.push(xf);
                return xfs.length - 1;
            }
            function toXml() {
                return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
                    '<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">' +
                    '<fonts count="' + fonts.length + '">' + fonts.join('') + '</fonts>' +
                    '<fills count="' + fills.length + '">' + fills.join('') + '</fills>' +
                    '<borders count="' + borders.length + '">' + borders.join('') + '</borders>' +
                    '<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>' +
                    '<cellXfs count="' + xfs.length + '">' + xfs.join('') + '</cellXfs>' +
                    '<cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles>' +
                    '</styleSheet>';
            }
            return { style, toXml };
        }

        function buildBoardXlsx(columns, studentTotal) {
            const styles = newStyleSheet();
            const colCount = Math.max(columns.length, 1);

            const titleStyle = styles.style({ font: { bold: true, size: 16 } });
            const subtitleStyle = styles.style({ font: { size: 11, color: '#64748b' } });

            // Per-column styles keyed to each column's theme.
            const colStyles = columns.map(c => ({
                header: styles.style({ font: { bold: true, color: c.theme.text }, fill: c.theme.header, border: c.theme.border, align: 'center' }),
                detail: styles.style({ font: { bold: true, size: 9, color: c.theme.text }, fill: c.theme.bg, border: c.theme.border }),
                body: styles.style({ font: { color: '#1e293b' }, fill: c.theme.bg, border: c.theme.border })
            }));

            const rows = [];
            const cell = (col, row, style, value, isNumber) => {
                const ref = colLetter(col) + row;
                if (value === undefined || value === null || value === '') {
                    return '<c r="' + ref + '" s="' + style + '"/>';
                }
                if (isNumber) return '<c r="' + ref + '" s="' + style + '"><v>' + value + '</v></c>';
                return '<c r="' + ref + '" s="' + style + '" t="inlineStr"><is><t xml:space="preserve">' +
                    xmlEscape(value) + '</t></is></c>';
            };

            let r = 1;
            // Title + subtitle rows (value in first cell; merged across the board).
            let cells = [cell(1, r, titleStyle, 'Grade ' + currentGrade + ' - ' + currentSubject + ' Groups')];
            for (let i = 2; i <= colCount; i++) cells.push(cell(i, r, titleStyle, ''));
            rows.push('<row r="' + r + '">' + cells.join('') + '</row>'); r++;

            cells = [cell(1, r, subtitleStyle, studentTotal + ' students across ' + columns.length + ' columns')];
            for (let i = 2; i <= colCount; i++) cells.push(cell(i, r, subtitleStyle, ''));
            rows.push('<row r="' + r + '">' + cells.join('') + '</row>'); r++;

            if (columns.length === 0) {
                rows.push('<row r="' + r + '"><c r="A' + r + '" t="inlineStr"><is><t>No columns available for this grade.</t></is></c></row>');
            } else {
                const maxStudents = columns.reduce((m, c) => Math.max(m, c.students.length), 0);

                // Header row.
                cells = columns.map((c, i) => cell(i + 1, r, colStyles[i].header, c.group + ' (' + c.students.length + ')'));
                rows.push('<row r="' + r + '">' + cells.join('') + '</row>'); r++;

                // Detail rows: Location / Skill / Curriculum.
                [['Location', 'location'], ['Skill', 'skill'], ['Curriculum', 'curriculum']].forEach(([label, key]) => {
                    cells = columns.map((c, i) => cell(i + 1, r, colStyles[i].detail, label + ': ' + (c.meta[key] ? c.meta[key] : '—')));
                    rows.push('<row r="' + r + '">' + cells.join('') + '</row>'); r++;
                });

                // Student rows.
                for (let s = 0; s < maxStudents; s++) {
                    cells = columns.map((c, i) => {
                        const student = c.students[s];
                        const name = student ? student.name + (student.team ? ' (' + student.team + ')' : '') : '';
                        return cell(i + 1, r, colStyles[i].body, name);
                    });
                    rows.push('<row r="' + r + '">' + cells.join('') + '</row>'); r++;
                }
            }

            const colsXml = '<cols>' + Array.from({ length: colCount }, (_, i) =>
                '<col min="' + (i + 1) + '" max="' + (i + 1) + '" width="24" customWidth="1"/>').join('') + '</cols>';
            const merges = colCount > 1
                ? '<mergeCells count="2"><mergeCell ref="A1:' + colLetter(colCount) + '1"/>' +
                  '<mergeCell ref="A2:' + colLetter(colCount) + '2"/></mergeCells>'
                : '';

            const sheetXml = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
                '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">' +
                colsXml + '<sheetData>' + rows.join('') + '</sheetData>' + merges + '</worksheet>';

            const sheetName = ('Grade ' + currentGrade + ' ' + currentSubject).slice(0, 31);
            const parts = {
                '[Content_Types].xml': '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
                    '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">' +
                    '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>' +
                    '<Default Extension="xml" ContentType="application/xml"/>' +
                    '<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>' +
                    '<Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>' +
                    '<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>' +
                    '</Types>',
                '_rels/.rels': '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
                    '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
                    '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>' +
                    '</Relationships>',
                'xl/workbook.xml': '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
                    '<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">' +
                    '<sheets><sheet name="' + xmlEscape(sheetName) + '" sheetId="1" r:id="rId1"/></sheets></workbook>',
                'xl/_rels/workbook.xml.rels': '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
                    '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
                    '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/>' +
                    '<Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>' +
                    '</Relationships>',
                'xl/worksheets/sheet1.xml': sheetXml,
                'xl/styles.xml': styles.toXml()
            };

            return zipStore(parts);
        }

        // CRC-32 (used by the ZIP container).
        const CRC32_TABLE = (() => {
            const t = new Uint32Array(256);
            for (let n = 0; n < 256; n++) {
                let c = n;
                for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
                t[n] = c >>> 0;
            }
            return t;
        })();

        function crc32(bytes) {
            let c = 0xFFFFFFFF;
            for (let i = 0; i < bytes.length; i++) c = CRC32_TABLE[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8);
            return (c ^ 0xFFFFFFFF) >>> 0;
        }

        // Build a ZIP archive using the STORED method (no compression).
        function zipStore(parts) {
            const enc = new TextEncoder();
            const files = Object.keys(parts).map(name => {
                const data = enc.encode(parts[name]);
                return { nameBytes: enc.encode(name), data, crc: crc32(data) };
            });

            const chunks = [];
            const central = [];
            let offset = 0;

            const u16 = v => [v & 0xFF, (v >>> 8) & 0xFF];
            const u32 = v => [v & 0xFF, (v >>> 8) & 0xFF, (v >>> 16) & 0xFF, (v >>> 24) & 0xFF];

            files.forEach(f => {
                const n = f.nameBytes.length;
                const local = [].concat(
                    u32(0x04034b50), u16(20), u16(0), u16(0), u16(0), u16(0),
                    u32(f.crc), u32(f.data.length), u32(f.data.length), u16(n), u16(0)
                );
                const localHeader = new Uint8Array(local);
                chunks.push(localHeader, f.nameBytes, f.data);

                const cd = [].concat(
                    u32(0x02014b50), u16(20), u16(20), u16(0), u16(0), u16(0), u16(0),
                    u32(f.crc), u32(f.data.length), u32(f.data.length),
                    u16(n), u16(0), u16(0), u16(0), u16(0), u32(0), u32(offset)
                );
                central.push(new Uint8Array(cd), f.nameBytes);

                offset += localHeader.length + n + f.data.length;
            });

            const centralStart = offset;
            let centralSize = 0;
            central.forEach(c => { chunks.push(c); centralSize += c.length; });

            const end = new Uint8Array([].concat(
                u32(0x06054b50), u16(0), u16(0), u16(files.length), u16(files.length),
                u32(centralSize), u32(centralStart), u16(0)
            ));
            chunks.push(end);

            const total = chunks.reduce((sum, c) => sum + c.length, 0);
            const out = new Uint8Array(total);
            let p = 0;
            chunks.forEach(c => { out.set(c, p); p += c.length; });
            return out;
        }

        function addGroupPrompt() {
            if (!currentGrade) { alert('Select a grade first.'); return; }
            const name = prompt(`New ${currentSubject} column for Grade ${currentGrade}:`);
            const trimmed = name && name.trim();
            if (!trimmed) return;
            if (boardColumns().includes(trimmed)) { alert('That column already exists.'); return; }

            ensureBoardState();
            groups[currentSubject][currentGrade].push(trimmed);
            columnMeta[currentSubject][currentGrade][trimmed] = {};
            renderBoard();
            toast('Creating column...', 'pending');

            if (!inAppsScript()) {
                toast('Column added locally', 'ok');
                return;
            }
            google.script.run
                .withSuccessHandler((result) => {
                    if (result && result.groups) {
                        groups[currentSubject][currentGrade] = result.groups;
                        renderBoard();
                    }
                    toast('Column added', 'ok');
                })
                .withFailureHandler((err) => {
                    groups[currentSubject][currentGrade] = groups[currentSubject][currentGrade].filter(g => g !== trimmed);
                    renderBoard();
                    toast('Column failed', 'err');
                    alert('Failed to add: ' + err);
                })
                .addGroup(currentSubject, currentGrade, trimmed);
        }

        function renameGroupPrompt(oldName) {
            const newName = prompt(`Rename "${oldName}" (${currentSubject}, Grade ${currentGrade}) to:`, oldName);
            if (!newName || !newName.trim() || newName === oldName) return;
            showLoading(true, 'Renaming...');
            google.script.run
                .withSuccessHandler(() => refreshData())
                .withFailureHandler((err) => { alert('Failed to rename: ' + err); showLoading(false); })
                .renameGroup(currentSubject, currentGrade, oldName, newName.trim());
        }

        function setGroupColor(groupName, color) {
            if (!colors[currentSubject]) colors[currentSubject] = {};
            if (!colors[currentSubject][currentGrade]) colors[currentSubject][currentGrade] = {};
            colors[currentSubject][currentGrade][groupName] = color;
            renderBoard(); // optimistic
            if (!inAppsScript()) return;
            google.script.run
                .withFailureHandler((err) => alert('Failed to save color: ' + err))
                .setGroupColor(currentSubject, currentGrade, groupName, color);
        }

        function setGroupMetadataFromInput(input) {
            const column = input.closest('.column-card').querySelector('.kanban-column');
            const groupName = column.dataset.group;
            const field = input.dataset.metaField;
            const value = input.value.trim();
            const meta = columnMetadata(groupName);
            meta[field] = value;

            if (!inAppsScript()) return;
            google.script.run
                .withSuccessHandler(() => toast('Column details saved', 'ok'))
                .withFailureHandler((err) => {
                    toast('Column details failed', 'err');
                    alert('Failed to save column details: ' + err);
                })
                .setGroupMetadata(currentSubject, currentGrade, groupName, { [field]: value });
        }

        function resetSortables() {
            cardSortables.forEach(sortable => sortable.destroy());
            cardSortables = [];
            if (columnSortable) {
                columnSortable.destroy();
                columnSortable = null;
            }
        }

        function renameGroupFromButton(button) {
            renameGroupPrompt(button.dataset.group);
        }

        function setGroupColorFromButton(button, color) {
            setGroupColor(button.dataset.group, color);
        }

        function deleteGroupFromButton(button) {
            deleteGroupPrompt(button.dataset.group);
        }

        function deleteGroupPrompt(groupName) {
            if (!currentGrade || groupName === 'Unassigned') return;
            if (paneGroup === groupName) closeColumnPane();
            const moved = students.filter(s => s.grade === currentGrade && s[currentSubject].group === groupName);
            const message = moved.length
                ? `Delete "${groupName}"? Its ${moved.length} student(s) will move to Unassigned.`
                : `Delete "${groupName}"?`;
            if (!confirm(message)) return;

            ensureBoardState();
            // Optimistic: move any cards in this column to Unassigned, then drop the column.
            moved.forEach(s => { s[currentSubject].group = 'Unassigned'; });
            if (moved.length && !groups[currentSubject][currentGrade].includes('Unassigned')) {
                groups[currentSubject][currentGrade].unshift('Unassigned');
            }
            groups[currentSubject][currentGrade] = groups[currentSubject][currentGrade].filter(g => g !== groupName);
            if (columnMeta[currentSubject][currentGrade]) delete columnMeta[currentSubject][currentGrade][groupName];
            if (colors[currentSubject][currentGrade]) delete colors[currentSubject][currentGrade][groupName];
            renderBoard();
            toast('Deleting column...', 'pending');

            if (!inAppsScript()) { toast('Column deleted locally', 'ok'); return; }
            google.script.run
                .withSuccessHandler((result) => {
                    if (result && result.groups) {
                        groups[currentSubject][currentGrade] = result.groups;
                        renderBoard();
                    }
                    toast('Column deleted', 'ok');
                })
                .withFailureHandler((err) => { toast('Delete failed — reloading', 'err'); refreshData(); })
                .deleteGroup(currentSubject, currentGrade, groupName);
        }

        function boardBarKey() {
            return `rtiBoardBar:${currentSubject}:${currentGrade}`;
        }

        function loadBoardBar() {
            const bar = document.getElementById('board-bar');
            bar.value = currentGrade ? (localStorage.getItem(boardBarKey()) || '') : '';
        }

        function saveBoardBar() {
            if (!currentGrade) return;
            localStorage.setItem(boardBarKey(), document.getElementById('board-bar').value);
        }

        function applyBoardZoom() {
            const board = document.getElementById('board');
            if (board) board.style.zoom = boardZoom;
            const label = document.getElementById('zoom-level');
            if (label) label.innerText = Math.round(boardZoom * 100) + '%';
        }

        function zoomBoard(dir) {
            if (dir === 0) {
                boardZoom = 1;
            } else {
                boardZoom = Math.min(ZOOM_MAX, Math.max(ZOOM_MIN,
                    Math.round((boardZoom + dir * ZOOM_STEP) * 100) / 100));
            }
            localStorage.setItem('rtiZoom', boardZoom);
            applyBoardZoom();
        }

        function renderBoard() {
            const board = document.getElementById('board');
            applyBoardZoom();
            resetSortables();
            board.innerHTML = '';
            if (!currentGrade) return;

            const gradeStudents = students.filter(s => s.grade === currentGrade);
            document.getElementById('current-view-title').innerText = `Grade ${currentGrade} · ${currentSubject}`;
            document.getElementById('student-count').innerText = `${gradeStudents.length} students`;
            loadBoardBar();

            const cols = boardColumns();
            const colColors = columnColors();

            cols.forEach(group => {
                const theme = COLUMN_THEMES[colColors[group] || 'slate'] || COLUMN_THEMES.slate;
                const escapedGroup = escapeHtml(group);
                const groupAttr = escapeAttr(group);
                const meta = columnMetadata(group);
                const inColumn = gradeStudents
                    .filter(s => s[currentSubject].group === group)
                    .sort((a, b) => scaleOf(a) - scaleOf(b));

                const colDiv = document.createElement('div');
                colDiv.className = `relative flex-shrink-0 w-80 rounded-2xl border flex flex-col shadow-sm max-h-full transition-colors duration-300 ${theme.bg} ${theme.border} column-card`;
                colDiv.innerHTML = `
                    ${group !== 'Unassigned' ? `<button type="button" data-group="${groupAttr}" onclick="event.stopPropagation(); deleteGroupFromButton(this)" title="Delete column" class="absolute top-1.5 right-1.5 z-10 h-5 w-5 flex items-center justify-center rounded-full bg-white/90 text-slate-400 border border-slate-200 shadow-sm hover:bg-red-500 hover:text-white hover:border-red-500 transition">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd" /></svg>
                    </button>` : ''}
                    <div class="px-2.5 py-1.5 flex flex-col border-b border-slate-200/50 rounded-t-2xl transition-colors hover:bg-white/60 ${theme.headerBg} column-drag-handle cursor-grab active:cursor-grabbing">
                        <div class="flex justify-between items-center gap-2 ${group !== 'Unassigned' ? 'pr-6' : ''}">
                            <h2 class="font-bold uppercase text-[10px] tracking-widest flex items-center gap-1.5 min-w-0 ${theme.text}">
                                <button type="button" data-group="${groupAttr}" onclick="event.stopPropagation(); openColumnPaneFromButton(this)" title="Expand column" class="truncate text-left hover:underline min-w-0">${escapedGroup}</button>
                                ${group !== 'Unassigned' ? `<button type="button" data-group="${groupAttr}" onclick="event.stopPropagation(); renameGroupFromButton(this)" title="Rename" class="opacity-60 hover:opacity-100 transition-opacity shrink-0">
                                    <svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3" viewBox="0 0 20 20" fill="currentColor"><path d="M13.586 3.586a2 2 0 112.828 2.828l-.793.793-2.828-2.828.793-.793zM11.379 5.793L3 14.172V17h2.828l8.38-8.379-2.83-2.828z" /></svg>
                                </button>` : ''}
                            </h2>
                            <div class="flex items-center gap-1.5 shrink-0">
                                <div class="flex space-x-1">
                                    ${COLOR_KEYS.map(c => `<button type="button" data-group="${groupAttr}" onclick="event.stopPropagation(); setGroupColorFromButton(this, '${c}')" class="w-3 h-3 rounded-full ${SWATCH[c]} border hover:scale-110 shadow-sm" title="${c}"></button>`).join('')}
                                </div>
                                <span class="bg-white px-1.5 py-0.5 rounded-full text-[10px] font-black border shadow-sm border-slate-200 ${theme.text}">${inColumn.length}</span>
                            </div>
                        </div>
                        <div class="mt-1 grid grid-cols-3 gap-1">
                            <input type="text" data-print-label="Location" data-meta-field="location" value="${escapeAttr(meta.location || '')}" onchange="setGroupMetadataFromInput(this)" placeholder="Location" class="min-w-0 text-[9px] bg-white/50 border border-transparent hover:border-slate-300 focus:bg-white focus:border-blue-400 rounded px-1 py-0.5 outline-none transition-colors ${theme.text}" />
                            <input type="text" data-print-label="Skill" data-meta-field="skill" value="${escapeAttr(meta.skill || '')}" onchange="setGroupMetadataFromInput(this)" placeholder="Skill" class="min-w-0 text-[9px] bg-white/50 border border-transparent hover:border-slate-300 focus:bg-white focus:border-blue-400 rounded px-1 py-0.5 outline-none transition-colors ${theme.text}" />
                            <input type="text" data-print-label="Curriculum" data-meta-field="curriculum" value="${escapeAttr(meta.curriculum || '')}" onchange="setGroupMetadataFromInput(this)" placeholder="Curriculum" class="min-w-0 text-[9px] bg-white/50 border border-transparent hover:border-slate-300 focus:bg-white focus:border-blue-400 rounded px-1 py-0.5 outline-none transition-colors ${theme.text}" />
                        </div>
                    </div>
                    <div data-group="${groupAttr}" class="kanban-column p-3 space-y-3 flex-grow overflow-y-auto min-h-[100px]">
                        ${renderCards(inColumn)}
                    </div>
                `;
                board.appendChild(colDiv);
            });

            board.querySelectorAll('.kanban-column').forEach(column => {
                cardSortables.push(new Sortable(column, {
                    group: 'rti-students',
                    animation: 200,
                    ghostClass: 'sortable-ghost',
                    draggable: '.student-card',
                    emptyInsertThreshold: 24,
                    onEnd: (evt) => {
                        const id = evt.item.getAttribute('data-id');
                        const from = evt.from.getAttribute('data-group');
                        const to = evt.to.getAttribute('data-group');
                        if (id && to !== from) saveMove(id, to);
                    }
                }));
            });

            columnSortable = new Sortable(board, {
                animation: 200,
                draggable: '.column-card',
                handle: '.column-drag-handle',
                ghostClass: 'sortable-ghost',
                filter: 'input, button, textarea, select',
                preventOnFilter: false,
                onEnd: () => saveColumnOrder()
            });
        }

        function saveColumnOrder() {
            ensureBoardState();
            const orderedGroups = Array.from(document.querySelectorAll('#board .kanban-column'))
                .map(column => column.dataset.group)
                .filter(Boolean);
            if (orderedGroups.length === 0) return;

            groups[currentSubject][currentGrade] = orderedGroups;
            if (!inAppsScript()) return;

            google.script.run
                .withSuccessHandler((result) => {
                    if (result && result.groups) groups[currentSubject][currentGrade] = result.groups;
                })
                .withFailureHandler(() => {
                    toast('Column order failed — reloading', 'err');
                    refreshData();
                })
                .updateGroupOrder(currentSubject, currentGrade, orderedGroups);
        }

        function renderCards(list) {
            if (list.length === 0) return `<div class="text-center py-6 text-slate-300 text-[10px] italic border border-dashed rounded-xl border-slate-200">Empty</div>`;
            return list.map(s => {
                const flag = (key, label) => `<span class="${FLAG_STYLES[key]} px-1.5 py-0.5 rounded text-[8px] font-bold">${label}</span>`;
                const flags = [
                    s.sped === 'Yes' ? flag('SPED', 'SPED') : '',
                    s.el === 'Yes' ? flag('EL', 'EL') : '',
                    s.five04 === 'Yes' ? flag('504', '504') : ''
                ].filter(Boolean).join('');
                const scale = s[currentSubject].scale;
                const scaleLabel = currentSubject === 'ELA' ? 'ORF' : 'IXL Score';
                return `
                <div data-id="${escapeAttr(s.id)}" onclick="openModalFromCard(this)" class="student-card relative bg-white p-4 rounded-xl shadow-sm border border-slate-200 cursor-grab hover:border-blue-400 hover:shadow-md transition-all">
                    <div class="absolute top-3 right-3 flex gap-1 pointer-events-none">
                        ${levelBadge(s, currentSubject, 'B')}
                        ${currentLevelBadge(s, currentSubject, 'C')}
                    </div>
                    <div class="flex items-center flex-wrap gap-1 pr-16 pointer-events-none">
                        <span class="font-bold text-slate-800 text-xs">${escapeHtml(s.name)}</span>
                        ${flags ? `<span class="inline-flex gap-1">${flags}</span>` : ''}
                    </div>
                    <div class="text-[10px] text-slate-400 mt-1 pointer-events-none">${escapeHtml(s.team || 'No Team')}</div>
                    ${currentSubject === 'ELA' ? `<div class="mt-3 flex items-center justify-between pointer-events-none">
                        <div class="text-[9px] bg-slate-50 px-2 py-1 rounded text-slate-500">Current Need: <span class="font-bold text-slate-700">${escapeHtml(s.currentNeed || '--')}</span></div>
                        <div class="text-[9px] bg-slate-50 px-2 py-1 rounded text-slate-500">Current %: <span class="font-bold text-indigo-600">${s.currentPct ? escapeHtml(s.currentPct) + '%' : '--'}</span></div>
                    </div>` : ''}
                    <div class="mt-3 flex items-center justify-between pointer-events-none">
                        <div class="text-[9px] bg-slate-50 px-2 py-1 rounded text-slate-500">${scaleLabel}: <span class="font-bold text-blue-600">${escapeHtml(scale || '--')}</span></div>
                        <div class="text-[9px] text-slate-400">Abs: <span class="${s.absences > 5 ? 'text-red-500 font-bold' : ''}">${s.absences}</span></div>
                    </div>
                    ${currentSubject === 'Math' ? `<div class="mt-2 flex pointer-events-none">
                        <div class="text-[9px] bg-slate-50 px-2 py-1 rounded text-slate-500">Tier 1 Level: <span class="font-bold text-blue-600">${s.tier1Level ? escapeHtml(s.tier1Level) + '%' : '--'}</span></div>
                    </div>` : ''}
                </div>`;
            }).join('');

        let paneGroup = null;

        function openColumnPaneFromButton(button) {
            openColumnPane(button.dataset.group);
        }

        function openColumnPane(group) {
            if (!currentGrade) return;
            paneGroup = group;
            renderColumnPane();
            const pane = document.getElementById('column-pane');
            const content = document.getElementById('column-pane-content');
            pane.classList.remove('hidden');
            void pane.offsetWidth;
            pane.classList.remove('opacity-0');
            content.classList.remove('scale-95');
        }

        function renderColumnPane() {
            if (paneGroup == null) return;
            const inColumn = students
                .filter(s => s.grade === currentGrade && s[currentSubject].group === paneGroup)
                .sort((a, b) => scaleOf(a) - scaleOf(b));

            document.getElementById('column-pane-title').innerText = paneGroup;
            document.getElementById('column-pane-sub').innerText =
                `Grade ${currentGrade} · ${currentSubject} · ${inColumn.length} student${inColumn.length === 1 ? '' : 's'}`;

            const body = document.getElementById('column-pane-body');
            body.innerHTML = inColumn.length
                ? `<div class="grid gap-3" style="grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));">${renderCards(inColumn)}</div>`
                : `<div class="text-center py-20 text-slate-400 text-sm italic">This column is empty.</div>`;
        }

        function closeColumnPane() {
            const pane = document.getElementById('column-pane');
            const content = document.getElementById('column-pane-content');
            pane.classList.add('opacity-0');
            content.classList.add('scale-95');
            setTimeout(() => pane.classList.add('hidden'), 200);
            paneGroup = null;
        }

        function openModalFromCard(card) {
            openModal(card.dataset.id);
        }

        /* ─────────────────────────── Student search ─────────────────────── */

        function searchMatches() {
            const q = (document.getElementById('student-search').value || '').trim().toLowerCase();
            if (!q) return [];
            return students
                .filter(s => String(s.name).toLowerCase().includes(q) || String(s.id).toLowerCase().includes(q))
                .sort((a, b) => String(a.name).localeCompare(String(b.name)))
                .slice(0, 12);
        }

        function onSearchInput() {
            const box = document.getElementById('search-results');
            const matches = searchMatches();
            if (!matches.length) {
                const q = (document.getElementById('student-search').value || '').trim();
                if (!q) { box.classList.add('hidden'); box.innerHTML = ''; return; }
                box.innerHTML = '<div class="px-3 py-3 text-sm text-slate-400 italic">No students found</div>';
                box.classList.remove('hidden');
                return;
            }
            box.innerHTML = matches.map(s => {
                const ela = s.ELA && s.ELA.group ? s.ELA.group : '—';
                const math = s.Math && s.Math.group ? s.Math.group : '—';
                return `<button type="button" onclick="selectSearchResult('${escapeAttr(s.id)}')"
                    class="w-full text-left px-3 py-2 hover:bg-blue-50 border-b border-slate-100 last:border-0 transition">
                    <div class="flex items-center justify-between">
                        <span class="text-sm font-semibold text-slate-800">${escapeHtml(s.name)}</span>
                        <span class="text-[10px] text-slate-400 font-mono">Gr ${escapeHtml(String(s.grade))}</span>
                    </div>
                    <div class="text-[11px] text-slate-500 mt-0.5">ELA: <span class="font-medium text-slate-600">${escapeHtml(ela)}</span> · Math: <span class="font-medium text-slate-600">${escapeHtml(math)}</span></div>
                </button>`;
            }).join('');
            box.classList.remove('hidden');
        }

        function onSearchKey(e) {
            if (e.key === 'Escape') { closeSearchResults(); e.target.blur(); return; }
            if (e.key === 'Enter') {
                const matches = searchMatches();
                if (matches.length) selectSearchResult(matches[0].id);
            }
        }

        function selectSearchResult(id) {
            closeSearchResults();
            const input = document.getElementById('student-search');
            if (input) input.value = '';
            const s = students.find(x => String(x.id) === String(id));
            if (s) openModal(s.id);
        }

        function closeSearchResults() {
            const box = document.getElementById('search-results');
            box.classList.add('hidden');
            box.innerHTML = '';
        }

        document.addEventListener('click', function (e) {
            const wrap = document.getElementById('search-wrap');
            if (wrap && !wrap.contains(e.target)) closeSearchResults();
        });

                        <span class="inline-flex items-center gap-1.5 text-xs font-bold px-2.5 py-1 rounded-full shadow-sm ${active ? 'bg-blue-600 text-white' : 'bg-slate-700 text-white'}">
                            <span class="text-[9px] uppercase tracking-wider opacity-70 font-semibold">Group</span>
